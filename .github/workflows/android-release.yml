name: Android Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Concrete semver only — never use the word "stable" here (that is a channel, not a version).
          flutter-version: '3.41.5'
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          # Write properties without shell interpolation in values (safe for $, !, etc.)
          python3 - <<'PY'
          import os
          from pathlib import Path

          def get(name: str) -> str:
              return os.environ[name].strip()

          text = "\n".join(
              [
                  f"storePassword={get('RELEASE_KEYSTORE_PASSWORD')}",
                  f"keyPassword={get('RELEASE_KEY_PASSWORD')}",
                  f"keyAlias={get('RELEASE_KEY_ALIAS')}",
                  "storeFile=release-key.jks",
              ]
          )
          Path("android/key.properties").write_text(text + "\n", encoding="utf-8")
          PY

      - name: Build release APK
        run: |
          set -euo pipefail
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/mindtape.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/mindtape.apk
          fail_on_unmatched_files: true

