name: Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Concrete semver only — never use the word "stable" here (that is a channel, not a version).
          flutter-version: '3.41.5'
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart analyze
        run: |
          set -euo pipefail
          dart analyze lib/

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          # Write properties without shell interpolation in values (safe for $, !, etc.)
          python3 - <<'PY'
          import os
          from pathlib import Path

          def get(name: str) -> str:
              return os.environ[name].strip()

          text = "\n".join(
              [
                  f"storePassword={get('RELEASE_KEYSTORE_PASSWORD')}",
                  f"keyPassword={get('RELEASE_KEY_PASSWORD')}",
                  f"keyAlias={get('RELEASE_KEY_ALIAS')}",
                  "storeFile=release-key.jks",
              ]
          )
          Path("android/key.properties").write_text(text + "\n", encoding="utf-8")
          PY

      - name: Build release APK
        env:
          # Optional: embeds a compile-time Whisper fallback (same as local --dart-define).
          # If unset, the APK still builds; voice uses on-device recognition until the user
          # adds a key in the app (key icon) or you set this secret later.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define=OPENAI_API_KEY="${OPENAI_API_KEY:-}"
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/mindtape.apk

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/mindtape.apk
          fail_on_unmatched_files: true

      - name: Upload APK artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mindtape-apk
          path: build/app/outputs/flutter-apk/mindtape.apk
